[project]
name = "job-search-copilot"
version = "0.1.0"
description = "Human-in-the-loop job search automation: aggregate listings, rank them with Claude, and tailor truthful resumes."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dynamic = ["dependencies"]

[project.scripts]
jobcopilot = "jobcopilot.cli:main"

[tool.setuptools]
packages = ["jobcopilot", "jobcopilot.sources", "jobcopilot.web"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.package-data]
"jobcopilot.web" = ["templates/*.html", "static/*", "static/icons/*"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["B008", "RUF001", "RUF002", "RUF003"]
