<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f4e79">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>{% block title %}Job Search Copilot{% endblock %}</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/static/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/static/icons/icon-192.png">
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">Job Copilot</a>
    <nav>
      <a href="/">Jobs</a>
      <a href="/profile">Profile</a>
    </nav>
  </header>
  <main class="container">
    {% if msg %}<div class="flash {% if msg.startswith('Error') %}flash-error{% endif %}">{{ msg }}</div>{% endif %}
    {% block content %}{% endblock %}
  </main>
  <div id="busy" class="busy" hidden><div class="spinner"></div><p>Working with Claude&hellip; this can take a minute.</p></div>
  <script src="/static/app.js" defer></script>
</body>
</html>
